volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3003 #change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3003"] #change port
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3003"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:1.3.0
    restart: always
    container_name: mairie360-db-message-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:1.3.0
    container_name: mairie360-liquibase-message-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack, not leave ZAP scanning without users.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-message-api #change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message: # change api name
    container_name: message_api-developpement # change api name
    # The API under test: the published ghcr.io/mairie360/message-api:dev-<sha> image in CI, or
    # message-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    ports:
      - "3003:3003" #change port
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://message.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /health and the services that need the API wait for it to
  # complete instead.
  message-ready:
    image: curlimages/curl:latest
    depends_on:
      message:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://message:3003/health >/dev/null; do
      echo "waiting for message..."; sleep 2; done; echo "message ready"'
    networks:
      - backend

  security-scan:
    image: zaproxy/zap-stable
    networks:
      - backend
    depends_on:
      message-ready:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
    # -t: the spec the API serves itself (utoipa), so ZAP imports every operation.
    # -O: the spec's `servers` (localhost:3003, development.mairie360.fr) are unreachable from
    #   this container; send every imported request to the `message` service instead.
    # -c rules.tsv: informational alerts are set to IGNORE; any other alert (WARN/FAIL) makes
    #   zap-api-scan.py exit != 0, which fails the job (no -I).
    # -z replacer: injects a static HS256 JWT (sub=1, the Admin seeded by liquibase, role=admin,
    #   exp=2100, signed with JWT_SECRET=b"secret") on every request, so the authenticated routes
    #   are scanned instead of answering 401.
    # -silent: no add-on update check or telemetry at daemon start (it can hang the scan with
    #   "Failed to connect to ZAP after 600 seconds").
    # -z is split with shlex: 'Bearer <jwt>' must stay quoted, otherwise ZAP only receives
    #   "Bearer" and the token is read as a file name.
    command:
      - zap-api-scan.py
      - -t
      - http://message:3003/api-docs/openapi.json
      - -f
      - openapi
      - -O
      - http://message:3003
      - -c
      - rules.tsv
      - -z
      - "-silent -config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement='Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6ImFkbWluIiwiZXhwIjo0MTAyNDQ0ODAwfQ.xCeBe_2QxRlXW8WXr3t6F69wbEHA93HbP_7l4OTJwjA'"
