# GDPR simulation risks reviewed and accepted (mairie360/CICD tests/gdpr/simulation/accepted.mjs).
# A high-risk AI finding whose fingerprint is listed no longer blocks the Prod release.
version: 1
risks:
  - fingerprint: 5715b33ffd36fc6169a6a21f  # conversations.title
    reason: >-
      Free text typed by agents (descriptions, comments, history, messages, event fields, titles): the platform cannot stop an agent from writing a name, an e-mail or a phone number there. The text is visible to the members of the resource (every agent for a public event). Erasure keeps it: anonymize_user() removes the author's identity and deletes only their private events, not names written in the text, and no retention rule covers these tables. Accepted for this release.
    date: 2026-11-25
    author: Quentintnrl
  - fingerprint: 73ef32d3ee2267d09b1d2492  # messages.content
    reason: >-
      Free text typed by agents (descriptions, comments, history, messages, event fields, titles): the platform cannot stop an agent from writing a name, an e-mail or a phone number there. The text is visible to the members of the resource (every agent for a public event). Erasure keeps it: anonymize_user() removes the author's identity and deletes only their private events, not names written in the text, and no retention rule covers these tables. Accepted for this release.
    date: 2026-11-25
    author: Quentintnrl
  - fingerprint: 3d050cb4750cca449e86bc68  # users_audit_log.new_data
    reason: >-
      Audit trail of the accounts (users_audit_log): the database trigger copies the users row on every change, and only administrators read it. On erasure, anonymize_user() replaces the identity keys of the user's rows with a salted hash whose salt is never stored (the sha256: values of the findings). The 10-year retention declared in retention_policies is not applied by fn_apply_retention_policies yet, so the rows stay until then. Accepted for this release.
    date: 2026-11-25
    author: Quentintnrl
