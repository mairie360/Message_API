name: API CI/CD

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@v1.7.0
    permissions:
          contents: write
          packages: write
          id-token: write
    with:
      postman_collection: ${{ vars.POSTMAN_MESSAGE_API_COLLECTION_ID }}
      postman_environment: ${{ vars.POSTMAN_MESSAGE_API_ENV_ID }}
      package_name: message-api
      cicd_version: v1.7.0
    secrets: inherit
