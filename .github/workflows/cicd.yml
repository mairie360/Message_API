name: API CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@v4.0.3
    permissions:
          contents: write
          packages: write
          id-token: write
    with:
      package_name: message-api
      cicd_version: v4.0.3
    secrets: inherit
