# GDPR log marker stack (MAIR-290): docker-compose-security.yml without ZAP, plus the
# `gdpr-marker` runner of mairie360/CICD (tests/gdpr/marker), which plays gdpr-marker.yaml with a
# marker user. gdpr_marker_test.sh then searches the logs of every container for its values.
# No published port: everything talks on the `backend` network.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3003 #change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # Message connects with its own role, like in staging/prod (MAIR-556). The superuser stays for
  # postgres, liquibase and the seeder.
  DB_USER: message_api
  DB_HOST: postgres
  DB_PASSWORD: message-api-password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3003"] #change port
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3003"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-949384c
    restart: always
    container_name: mairie360-db-message-api-gdpr
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-949384c
    container_name: mairie360-liquibase-message-api-gdpr
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dmessage_api_password=message-api-password
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: mairie360-redis-message-api-gdpr #change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message: # change api name
    container_name: message_api-developpement-gdpr # change api name
    # The API under test: the published ghcr.io/mairie360/message-api:dev-<sha> image in CI, or
    # message-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://message.development.mairie360.fr
      # MAIR-680: Core's public key only, no JWT_SECRET, so every HS256 token is refused. Fresh key
      # pair per run from the matching *_test.sh script (test_secrets.sh), which also signs the
      # runners' tokens with it: no key or token is committed.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # ZAP imports the spec the API serves; never set on a deployed instance (MAIR-424).
      SWAGGER_ENABLED: "true"
      # ZAP scans every operation as one admin: the per-user rate limit would answer 429 (MAIR-425).
      RATE_LIMIT_PER_SECOND: "0"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (PostgreSQL and Redis answer) and the services that need
  # the API wait for it to complete instead.
  message-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    depends_on:
      message:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://message:3003/ready >/dev/null; do
      echo "waiting for message..."; sleep 2; done; echo "message ready"'
    networks:
      - backend

  gdpr-marker:
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      message-ready:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    environment:
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT must be set, run gdpr_marker_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
