[package]
name = "message_api" #change api name
version = "0.1.0"
edition = "2021"

[dependencies]
actix-governor = "0.10.0"
actix-web = "4"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2.1"
futures-util = "0.3"
mairie360_api_lib = "3.0.0"
percent-encoding = "2.3"
redis = { version = "1.6", default-features = false, features = ["tokio-comp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.0", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-actix-web = "0.7.25"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }

[dev-dependencies]
mairie360_api_lib = { version = "3.0.0", features = ["test-utils"] }
serial_test = "4.0.0"
testcontainers = "0.28"
url = "2.5"
# Forges the tokens the refusal sweep sends (same version and features as mairie360_api_lib).
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
once_cell = "1.21.3"


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
