volumes:
  postgres-data:
  redis-data:
  openapi-spec:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3003 #change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3003"] #change port
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3003"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:1.3.0
    restart: always
    container_name: mairie360-db-message-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:1.3.0
    container_name: mairie360-liquibase-message-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack, not leave k6 running without its users.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-message-api #change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message: # change api name
    container_name: message_api-developpement # change api name
    # The API under test: the published ghcr.io/mairie360/message-api:dev-<sha> image in CI, or
    # message-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    ports:
      - "3003:3003" #change port
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://message.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /health and the services that need the API wait for it to
  # complete instead.
  # It also saves the spec served by the image under test into the `openapi-spec` volume: that
  # is the coverage reference of load-test.js (openapi.json is gitignored, so the CI checkout has
  # none, and the served spec is the one of the exact image being tested).
  message-ready:
    image: curlimages/curl:latest
    # Root, to write into the freshly created `openapi-spec` volume.
    user: "0"
    depends_on:
      message:
        condition: service_started
    volumes:
      - openapi-spec:/spec
    command: >
      sh -c 'until curl -fsS http://message:3003/health >/dev/null; do
      echo "waiting for message..."; sleep 2; done;
      curl -fsS -o /spec/openapi.json http://message:3003/api-docs/openapi.json && echo "message ready"'
    networks:
      - backend

  k6-perf-test:
    image: grafana/k6:latest
    networks:
      - backend
    # load-test.js declares one handler per operation of the spec through the shared OpenAPI
    # coverage module (MAIR-194, mairie360/CICD tests/k6, see performance_test.sh): k6 aborts at
    # init when an operation has no handler, and fails its thresholds when one is not exercised.
    volumes:
      - ./load-test.js:/load-test.js:ro
      - ./cicd-repo/tests/k6/coverage.js:/coverage.js:ro
      - openapi-spec:/spec:ro
    command: ["run", "/load-test.js"]
    environment:
      - BASE_URL=http://message:3003
      - OPENAPI_SPEC=/spec/openapi.json
    depends_on:
      message-ready:
        condition: service_completed_successfully
      # The fixtures load-test.js relies on (init-test.sql).
      seeder:
        condition: service_completed_successfully
