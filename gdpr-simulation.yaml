# GDPR usage simulation (MAIR-497), played by mairie360/CICD tests/gdpr/simulation on the test
# stack only (docker-compose-gdpr-simulation.yml, gdpr_simulation_test.sh).
#
# Fictitious personas with unique values go through the marker journey of MAIR-290: their names,
# e-mails and phone numbers are written in chat titles and message contents, in query strings and
# in deliberate errors, then the message and the chat are deleted. The logs of every container, the
# Redis keys, the database after the purge and a sample of its free-text columns are then checked
# and reviewed (CICD analyze.mjs).
version: 1
journey: gdpr-marker.yaml
personas: 4
erased: 1
# Message_API holds no account: a persona only lives in the chat and the messages it was written
# in. The journey already deletes the message and the chat, the only deletion Message_API offers;
# the erase step checks that the chat is gone. Until the erasure of MAIR-289 reaches this content,
# the erasure findings of the analysis are expected failures.
erase:
  - name: the persona's chat is gone after its deletion
    request:
      method: GET
      path: "/api/v1/{{chat_id}}/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
    expect: [404]
