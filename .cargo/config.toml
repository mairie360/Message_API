[alias]

#This alias check the lint
lint_check = "fmt --all -- --check"

# This alias formats the code
lint_fix = "fmt --all"

# This alias check the code
check_code = "clippy --all-targets --all-features -- -D warnings"

# This alias generate the OpenAPI documentation
open_api = "run --example generate_openapi"

cov = ["llvm-cov", "--workspace", "--ignore-filename-regex", "endpoints|database/.*/view\\.rs", "--fail-under-lines", "60"]
